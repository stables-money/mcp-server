# Cloudflare Worker for the hosted Stables MCP server.
#
#   npm run dev:worker      # local, http://localhost:8787/mcp
#   npm run deploy:worker   # publishes the Worker
#
# The Worker stores no secrets: each request carries the caller's API key.
name = "stables-mcp"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Only reachable via mcp.stables.money so the zone WAF and rate-limit rules
# apply to every request; the workers.dev hostname would bypass them.
workers_dev = false

[observability]
enabled = true

# Production hostname. Cloudflare creates the DNS record and certificate for a
# custom domain when the Worker is deployed with this block present.
[[routes]]
pattern = "mcp.stables.money"
custom_domain = true

# Per-caller rate limit, keyed on API key (or client IP when no key is sent).
# Backstop behind the zone rate-limit rule; one MCP tool call is one request.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
