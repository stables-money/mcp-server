# Cloudflare Worker for the hosted Stables MCP server.
#
#   npm run dev:worker      # local, http://localhost:8787/mcp
#   npm run deploy:worker   # publishes the Worker
#
# Secrets (`wrangler secret put`): AUTH0_CLIENT_SECRET for the OAuth sign-in,
# MCP_GATEWAY_SIGNING_SECRET shared with api-lambda-authoriser so production
# accepts requests from the Worker's shared egress IPs. Customer API keys are
# never stored by the Worker itself: an OAuth grant keeps the key it minted,
# encrypted, in OAUTH_KV.
name = "stables-mcp"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
# global_fetch_strictly_public: required by the OAuth provider for Client ID
# Metadata Document fetches (SSRF protection).
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# Only reachable via mcp.stables.money so the zone WAF and rate-limit rules
# apply to every request; the workers.dev hostname would bypass them.
workers_dev = false

[observability]
enabled = true

[vars]
# Canonical public origin: the OAuth issuer and the token audience base.
MCP_PUBLIC_URL = "https://mcp.stables.money"
# Auth0 custom domain and the "Stables MCP" regular-web application.
AUTH0_DOMAIN = "login.stables.money"
AUTH0_CLIENT_ID = "ZBEJsdhpg2JcLgTC5alePBpERrRAjC6u"
# Sign-ins whose ID token reports no MFA are logged (oauth_signin_without_mfa).
# Set to "enforce" to refuse them once the logs show every sign-in carries it.
# MCP_REQUIRE_MFA = "enforce"

# OAuth clients, grants and tokens (hashed; grant props encrypted).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "0d242b3719c7440194034c25c85e207f"

# Production hostname. Cloudflare creates the DNS record and certificate for a
# custom domain when the Worker is deployed with this block present.
[[routes]]
pattern = "mcp.stables.money"
custom_domain = true

# Per-caller rate limit, keyed on API key (or client IP when no key is sent).
# Backstop behind the zone rate-limit rule; one MCP tool call is one request.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Per-IP ceiling checked first on every request, so made-up tokens can't each
# get their own bucket. Generous: Claude.ai and ChatGPT share a few egress IPs.
[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 1000, period = 60 }

# Tight per-IP limit on the browser sign-in pages (/authorize, /callback),
# which write to KV on every visit.
[[ratelimits]]
name = "SIGNIN_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }
