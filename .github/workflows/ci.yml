name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The hosted server is a Cloudflare Worker bundled from the same source.
      # A dry run needs no credentials and fails the build if the Worker no
      # longer bundles — say, from a Node-only import creeping into the handler.
      - name: Check the Worker still bundles
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-dry-run

      # The tests mock fetch, so they prove what we send and nothing about what
      # the API still accepts — which is how four months of drift went unnoticed.
      # This checks our endpoints against the live spec, and skips itself if the
      # spec is unreachable so an unrelated outage cannot fail a build.
      - name: Check for API spec drift
        run: npm run check:spec
