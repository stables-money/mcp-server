name: Deploy hosted server

# The hosted server (mcp.stables.money) is a Cloudflare Worker built from the
# same source as the npm package. It deploys when a release is published, in
# step with the npm publish, so the hosted and local servers never diverge.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   — a token with "Workers Scripts: Edit" on the account
#   CLOUDFLARE_ACCOUNT_ID  — the Stables Cloudflare account id

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
