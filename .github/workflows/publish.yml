name: Publish to npm and the MCP Registry

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint an OIDC token, which is both how npm identifies
      # this workflow (trusted publishing) and how provenance is signed.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # 2.2.2 was released without bumping package.json, so npm refused to
      # publish over 2.2.1 and the release shipped nothing. Fail first, and say why.
      - name: Check the release tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release $GITHUB_REF_NAME does not match package.json ($version). Bump with 'npm version' on main before releasing."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs a newer npm than Node 22 ships with.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # No NODE_AUTH_TOKEN: npm authenticates this workflow over OIDC against
      # the trusted publisher configured on the package. Nothing to leak, nothing
      # to rotate, and no 2FA bypass on a long-lived token — which is what npm
      # recommends over the alternative, and why we are not carrying one.
      # Provenance is inferred under trusted publishing, so the flag is dropped.
      - run: npm publish --access public

  # Keeps the official MCP Registry listing (money.stables/mcp) on the version
  # just published. The registry checks mcpName inside the npm package, so this
  # runs after npm publish. The namespace is proven by the TXT record on
  # stables.money; MCP_REGISTRY_PRIVATE_KEY is the matching Ed25519 private key
  # (hex), stored as a repository secret and never in the repo.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
      MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help > /dev/null

      - name: Check server.json matches the release
        run: |
          tag="${GITHUB_REF_NAME#v}"
          listed="$(jq -r .version server.json)"
          if [ "$tag" != "$listed" ]; then
            echo "::error::server.json is at $listed but the release is $tag. 'npm version' keeps them in step."
            exit 1
          fi

      - name: Publish to the MCP Registry
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo "::warning::MCP_REGISTRY_PRIVATE_KEY is not set; the registry listing was not updated."
            exit 0
          fi
          ./mcp-publisher login dns --domain stables.money --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          # npm can take a moment to serve the new version to the registry's check.
          for attempt in 1 2 3 4; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "Publish attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "::error::Could not publish to the MCP Registry"
          exit 1
